<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Consultar | CRUD</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header>
      <h1>Cadastro de Pessoas</h1>
      <p>CRUD com JSON Server</p>
      <nav>
        <a href="/post/">Cadastrar</a
        ><a class="active" href="/get/">Consultar</a><a href="/put/">Editar</a
        ><a href="/delete/">Excluir</a>
      </nav>
    </header>
    <main>
      <section class="card">
        <h2>Dados cadastrais</h2>
        <p class="hint">
          Liste todos os registros ou busque diretamente pelo CPF.
        </p>
        <div class="toolbar">
          <label
            >Buscar por CPF<input
              id="cpf-search"
              maxlength="14"
              inputmode="numeric"
              placeholder="000.000.000-00" /></label
          ><button id="search">Buscar</button
          ><button id="all" class="secondary">Listar todos</button>
        </div>
        <div class="message" role="status"></div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>CPF</th>
                <th>Nome</th>
                <th>Sobrenome</th>
                <th>E-mail</th>
                <th>Idade</th>
                <th>Telefone</th>
                <th>Endereço</th>
                <th>RG</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="results"></tbody>
          </table>
        </div>
      </section>
    </main>
    <script src="/shared.js"></script>
    <script src="/get/script.js"></script>
  </body>
</html>
